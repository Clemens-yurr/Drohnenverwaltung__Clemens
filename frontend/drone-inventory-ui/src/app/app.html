<header class="app-header">
  <div class="brand">
    <h1>Drone lending</h1>
    <p>Drones, student groups and their loans in one place.</p>
  </div>
  <nav aria-label="Main navigation">
    <a routerLink="/drones" routerLinkActive="active">Drones</a>
    <a routerLink="/student-groups" routerLinkActive="active">Student groups</a>
    <a routerLink="/loans" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Active loans
    </a>
    <a routerLink="/loans/new" routerLinkActive="active">New loan</a>
    <a routerLink="/loans/history" routerLinkActive="active">Loan history</a>
  </nav>
</header>

<main>
  <router-outlet />
</main>
